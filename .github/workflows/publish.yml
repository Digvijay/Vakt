name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore src/ProjectVakt.sln
      
    - name: Build
      run: dotnet build src/ProjectVakt.sln --configuration Release --no-restore
      
    - name: Pack Vakt.Core
      run: dotnet pack src/Vakt.Core/Vakt.Core.csproj --configuration Release --no-build --output ./nupkg
      
    - name: Pack Vakt.CLI
      run: dotnet pack src/Vakt.CLI/Vakt.CLI.csproj --configuration Release --no-build --output ./nupkg
      
    - name: Push to NuGet
      run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build and push Vakt.Proxy
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Vakt.Proxy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vakt-proxy:latest
            ghcr.io/${{ github.repository_owner }}/vakt-proxy:${{ github.ref_name }}
            
      - name: Build and push Vakt.Intelligence
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Vakt.Intelligence/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vakt-intelligence:latest
            ghcr.io/${{ github.repository_owner }}/vakt-intelligence:${{ github.ref_name }}
